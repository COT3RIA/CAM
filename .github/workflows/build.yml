name: Build Webcam VST

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # JUCE 7.0.12 не собирается с macOS 15 SDK (CGWindowListCreateImage удалён),
          # поэтому macOS-сборка закреплена на macos-14 с Xcode 15.4 (SDK 14.x).
          - name: macOS
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcode-select -p
          xcrun --show-sdk-version

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          find build/WebcamVST_artefacts/Release -name "*.vst3" -exec codesign --force --deep -s - {} \;
          find build/WebcamVST_artefacts/Release -name "*.app" -exec codesign --force --deep -s - {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebcamViewer-${{ matrix.name }}
          path: |
            build/WebcamVST_artefacts/Release/VST3
            build/WebcamVST_artefacts/Release/Standalone
          if-no-files-found: error
